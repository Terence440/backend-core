name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*" # Only publish on version tags

concurrency:
  group: "npm-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check branch for tag # Only trigger automate in origin/main
        run: |
          TAG_REF=$(git describe --tags --exact-match)
          BRANCH=$(git branch -r --contains $TAG_REF | grep origin/main || true)
          if [ -z "$BRANCH" ]; then
            echo "Tag is not on main, skipping publish"
            exit 78   # special code to skip workflow gracefully
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
